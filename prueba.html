
<!DOCTYPE html>
<html lang="es">
<meta charset="UTF-8">
<h2>MRBARBER 1996</h2>
<p id="estado">Comprobando conexión...</p>

<script>
async function probar() {
  const estado = document.getElementById('estado');
  try {
    const respuesta = await fetch(
      'https://jkcfcfkfrhbstdsogfcf.supabase.co/rest/v1/services?select=*',
      {
        headers: {
          apikey: 'sb_publishable_62E1s1mOWelEuP4LMGjhjw_PTF7nrYX'
        },
        signal: AbortSignal.timeout(15000)
      }
    );
    const datos = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(JSON.stringify(datos));
    }

    estado.textContent =
      'Conexión correcta. Servicios: ' + datos.length;
  } catch (error) {
    estado.textContent = 'Error: ' + error.message;
  }
}
probar();
</script>
</html>
